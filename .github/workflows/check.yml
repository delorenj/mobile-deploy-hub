name: Check

# The hub's own checks on every push to main and every pull request: `mise run check` (actionlint over
# .github/workflows/*.yml, this file included, then node --test 'tools/**/*.test.mjs'), with the actionlint 1.7.12 that the
# check task pins in mise.toml. It runs twice, as a matrix: Node 24 (the hub's runtime, the task's own pin) and Node 26
# (`mise run --tool node@26 check` overrides the task's tool pin for that leg only; the pin in mise.toml stays 24).
#
# A GitHub-hosted runner, on purpose: this repository is public, so hosted minutes are free, and nothing here deploys.
# mobile-deploy.yml is workflow_call only and writes its self-hosted labels itself, so no deploy job can land here.
# The tests are hermetic (tools/ci/test-fixtures.mjs hermetic()): no MinIO on 127.0.0.1:9012, no adb, op, mc or
# bb-emit, no ~/.cache or ~/.config state, and the runner's own GITHUB_* context never reaches a lane under test. The
# two Bloodbank contract checks skip themselves where bb-emit is not installed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The check task's tools are installed here, where the action's GitHub token covers the actionlint download;
      # `mise run check` then finds them installed. mise-action trusts this checkout's mise.toml (MISE_TRUSTED_CONFIG_PATHS).
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: node@${{ matrix.node }} actionlint@1.7.12
      # NODE_MATRIX_MAJOR (not a HUB_ name: the suite's hermetic() clears those) is read by the suite (tools/ci/v11.test.mjs): a leg whose `--tool` override did not take, and so ran
      # another Node than its name says, fails instead of passing quietly.
      - run: mise run --tool node@${{ matrix.node }} check
        env:
          NODE_MATRIX_MAJOR: ${{ matrix.node }}
