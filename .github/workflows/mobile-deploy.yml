name: Mobile Deploy

# Reusable workflow (hub v3). The app is the caller and the jobs run on the caller's repo-scoped runners; this repo
# owns only the job graph and tools/ci. The caller grants `contents: write` (the bump commit and tag, the sideload
# Release) and `id-token: write` (keyless Play); a called job can only narrow what the caller grants.
#
# A v3 deploy (manifest schema 2): preflight-ios (Mac) -> plan (bump) -> android (S26) | ios-export -> ios (iPad)
# -> announce (one Bloodbank event). A schema 1 manifest still runs the v2 way (no bump, no installs, no event).
#
# A skipped job skips everything that needs it unless the dependent says otherwise, so plan, ios and announce carry
# explicit conditions: an Android-only deploy skips the Mac preflight, apps without a Linux iOS export skip
# ios-export, and announce always runs.
#
# `uses:` takes no expressions, so the ref in every `delorenj/mobile-deploy-hub/actions/hub@v1.0.0` below must match
# the ref the caller used for this file. A new hub version flips all of them in one commit, then tags that commit.
on:
  workflow_call:
    inputs:
      manifest:
        description: Path of the app manifest inside the checkout
        type: string
        default: mobile-deploy.json
      platform:
        description: both, android or ios (narrows the devices too)
        type: string
        default: both
      bump:
        description: patch, minor or major. Every deploy bumps; a failed one is finished with Re-run failed jobs
        type: string
        default: patch
      testflight:
        description: Also upload to TestFlight Owner Testing (apps with ios.store)
        type: boolean
        default: false
      play:
        description: Also upload the AAB to Play (apps with android.bundle)
        type: boolean
        default: false
      dry_run:
        description: Build and verify only; no commit, tag, push, install, Release, TestFlight, Play or event
        type: boolean
        default: true
      dry_handoff:
        description: On a dry run also hand the Linux Xcode export to the Mac and build and check the iPad IPA
        type: boolean
        default: false
      strict:
        description: A dry run fails, as a real run does, when a check could not be made (a locked Mac leaves the 1Password references unread)
        type: boolean
        default: true
      linux_runner:
        description: JSON array of runner labels for Linux jobs
        type: string
        default: '["self-hosted","Linux"]'
      mac_runner:
        description: JSON array of runner labels for the Mac jobs
        type: string
        default: '["self-hosted","macOS"]'
      wif_provider:
        description: Workload Identity Federation provider, real Play runs only
        type: string
        default: ''
      play_sa:
        description: Service account the Play upload impersonates, real Play runs only
        type: string
        default: ''
      android_channel:
        description: v2 callers (manifest schema 1) only, sideload or play
        type: string
        default: sideload
      track:
        description: Play track
        type: string
        default: internal
      play_status:
        description: Play release status, draft until the app has shipped once
        type: string
        default: draft
      build:
        description: v2 callers (manifest schema 1) only, iOS build number override
        type: string
        default: ''

permissions:
  contents: read

jobs:
  preflight-ios:
    if: ${{ inputs.platform != 'android' }}
    runs-on: ${{ fromJSON(inputs.mac_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ipad_version: ${{ steps.hub.outputs.ipad_version }}
      ipad_build: ${{ steps.hub.outputs.ipad_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: hub
        name: iPad, signing, profile, disk
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: preflight-ios
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          testflight: ${{ inputs.testflight }}
          dry_run: ${{ inputs.dry_run }}
          strict: ${{ inputs.strict }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: preflight-ios-out
          path: ${{ runner.temp }}/hub-out/preflight/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  plan:
    needs: preflight-ios
    if: ${{ !cancelled() && (needs.preflight-ios.result == 'success' || needs.preflight-ios.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 15
    concurrency:
      group: mobile-deploy-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      schema: ${{ steps.hub.outputs.schema }}
      version: ${{ steps.hub.outputs.version }}
      android_code: ${{ steps.hub.outputs.android_code }}
      ios_build: ${{ steps.hub.outputs.ios_build }}
      build_sha: ${{ steps.hub.outputs.build_sha }}
      bump_patch: ${{ steps.hub.outputs.bump_patch }}
      run_android: ${{ steps.hub.outputs.run_android }}
      run_ios: ${{ steps.hub.outputs.run_ios }}
      run_ios_export: ${{ steps.hub.outputs.run_ios_export }}
      play_lane: ${{ steps.hub.outputs.play_lane }}
      release_lane: ${{ steps.hub.outputs.release_lane }}
    steps:
      # Full history and tags: the bump is a real commit and the machine's pre-push guard refuses a shallow push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: hub
        name: S26, event contract, version bump
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: plan
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          bump: ${{ inputs.bump }}
          testflight: ${{ inputs.testflight }}
          play: ${{ inputs.play }}
          channel: ${{ inputs.android_channel }}
          track: ${{ inputs.track }}
          play_status: ${{ inputs.play_status }}
          build: ${{ inputs.build }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          strict: ${{ inputs.strict }}
          ipad_version: ${{ needs.preflight-ios.outputs.ipad_version }}
          ipad_build: ${{ needs.preflight-ios.outputs.ipad_build }}
          wif_provider: ${{ inputs.wif_provider }}
          play_sa: ${{ inputs.play_sa }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: plan-out
          path: ${{ runner.temp }}/hub-out/plan/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  android:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_android == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 45
    concurrency:
      group: mobile-deploy-android-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - name: Build, check, install on the S26 and read it back
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: android
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          bump: ${{ inputs.bump }}
          play: ${{ inputs.play }}
          channel: ${{ inputs.android_channel }}
          dry_run: ${{ inputs.dry_run }}
          version: ${{ needs.plan.outputs.version }}
          android_code: ${{ needs.plan.outputs.android_code }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
      - name: Authenticate to Google Cloud (keyless)
        if: ${{ !inputs.dry_run && needs.plan.outputs.play_lane == 'true' }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.play_sa }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Upload to Play
        if: ${{ !inputs.dry_run && needs.plan.outputs.play_lane == 'true' }}
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: play
          manifest: ${{ inputs.manifest }}
          play: ${{ inputs.play }}
          channel: ${{ inputs.android_channel }}
          track: ${{ inputs.track }}
          play_status: ${{ inputs.play_status }}
          dry_run: ${{ inputs.dry_run }}
          android_code: ${{ needs.plan.outputs.android_code }}
          play_token: ${{ steps.auth.outputs.access_token }}
      - name: Publish the APK to a private Release
        if: ${{ !inputs.dry_run && needs.plan.outputs.release_lane == 'true' }}
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: release
          manifest: ${{ inputs.manifest }}
          bump: ${{ inputs.bump }}
          channel: ${{ inputs.android_channel }}
          dry_run: ${{ inputs.dry_run }}
          version: ${{ needs.plan.outputs.version }}
          android_code: ${{ needs.plan.outputs.android_code }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          github_token: ${{ github.token }}
      # Receipts only (the Release holds the APK). always(): a timed-out or cancelled lane still tells announce why.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: android-out
          path: ${{ runner.temp }}/hub-out/android/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  ios-export:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ios_export == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 30
    concurrency:
      group: mobile-deploy-ios-export-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - name: Export the Xcode projects and hand them to the Mac
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: ios-export
          manifest: ${{ inputs.manifest }}
          testflight: ${{ inputs.testflight }}
          build: ${{ inputs.build }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          version: ${{ needs.plan.outputs.version }}
          ios_build: ${{ needs.plan.outputs.ios_build }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ios-receipt
          path: ${{ runner.temp }}/hub-out/ios/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}
      # v2 callers only: a schema 2 manifest hands the Xcode project to the Mac over the LAN, not through quota.
      - uses: actions/upload-artifact@v4
        if: ${{ needs.plan.outputs.schema == '1' && (!inputs.dry_run || inputs.dry_handoff) }}
        with:
          name: xcode-project
          path: ${{ runner.temp }}/hub-out/ios/*.tgz
          overwrite: true
          retention-days: 1

  ios:
    needs: [plan, ios-export]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ios == 'true' && (needs.ios-export.result == 'success' || needs.ios-export.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.mac_runner) }}
    timeout-minutes: 120
    concurrency:
      group: mobile-deploy-ios-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The app tree is needed here too: ios.device and the store hooks are the app's own tools.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ needs.ios-export.result == 'success' }}
        with:
          name: ios-receipt
          path: ${{ runner.temp }}/hub-out/ios
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.schema == '1' && (!inputs.dry_run || inputs.dry_handoff) }}
        with:
          name: xcode-project
          path: ${{ runner.temp }}/hub-out/ios
      - name: Build, check, install on the iPad and read it back
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: ios
          manifest: ${{ inputs.manifest }}
          bump: ${{ inputs.bump }}
          testflight: ${{ inputs.testflight }}
          build: ${{ inputs.build }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          strict: ${{ inputs.strict }}
          version: ${{ needs.plan.outputs.version }}
          ios_build: ${{ needs.plan.outputs.ios_build }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ios-out
          path: |
            ${{ runner.temp }}/hub-out/ios/hub-receipt-ios.json
            ${{ runner.temp }}/hub-out/ios/hub-receipt-ios-upload.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  announce:
    needs: [preflight-ios, plan, android, ios-export, ios]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '{preflight-ios-out,plan-out,android-out,ios-receipt,ios-out}'
          path: ${{ runner.temp }}/hub-out/receipts
      - name: One Bloodbank event (a dry run only checks it)
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.0.0
        with:
          command: announce
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          dry_run: ${{ inputs.dry_run }}
          needs: ${{ toJSON(needs) }}
