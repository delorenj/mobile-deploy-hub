name: Mobile Deploy

# Reusable workflow (hub v1.1, docs/design-hub-v1.1.md). The app is the caller (templates/deploy.yml, pinned @v1) and
# the jobs run on the caller's repo-scoped runners; this repo owns only the job graph, the policy and tools/ci.
#
# gate (Linux: the policy, the caller, the Mac's link, the S26, the build directory) -> preflight-ios (Mac, no
# checkout) -> plan (the bump) -> android | ios-export -> ios -> deliver (the S3 build directory) -> announce (one
# Bloodbank event). An absent device is pending, not a stop: the run still bumps, builds, publishes and goes green.
#
# A skipped job skips everything that needs it unless the dependent says otherwise, so plan, ios, deliver and announce
# carry explicit conditions: the gate skips preflight-ios when the Mac is offline or over its data budget, apps
# without a Linux iOS export skip ios-export, deliver runs whenever the plan succeeded, and announce always runs.
#
# `uses:` takes no expressions, so every `delorenj/mobile-deploy-hub/actions/hub@<tag>` below names one exact hub
# version: a run and its reruns use one version, whatever `v1` points at later. `mise run release` flips them all in
# one commit, tags it vX.Y.Z and moves v1.
on:
  workflow_call:
    inputs:
      manifest:
        description: Path of the app manifest inside the checkout
        type: string
        default: mobile-deploy.json
      platform:
        description: both, android or ios (narrows the devices too)
        type: string
        default: both
      bump:
        description: patch, minor or major. Every deploy bumps; a failed one is finished with Re-run failed jobs
        type: string
        default: patch
      testflight:
        description: Also upload to TestFlight Owner Testing (apps with ios.store)
        type: boolean
        default: false
      play:
        description: Also upload the AAB to Play (apps with android.bundle)
        type: boolean
        default: false
      dry_run:
        description: Build and verify only; no commit, tag, push, install, Release, TestFlight, Play or event
        type: boolean
        default: true
      dry_handoff:
        description: On a dry run also hand the Linux Xcode export to the Mac and build and check the iPad IPA
        type: boolean
        default: false
      strict:
        description: A dry run fails, as a real run does, when a check could not be made (the gate refuses false)
        type: boolean
        default: true
      metered:
        description: auto skips the iPad lane when the Mac's metered link would go over the data budget; allow builds it anyway
        type: string
        default: auto
      linux_runner:
        description: JSON array of runner labels for Linux jobs
        type: string
        default: '["self-hosted","Linux"]'
      mac_runner:
        description: JSON array of runner labels for the Mac jobs
        type: string
        default: '["self-hosted","macOS"]'
      wif_provider:
        description: Workload Identity Federation provider, real Play runs only
        type: string
        default: ''
      play_sa:
        description: Service account the Play upload impersonates, real Play runs only
        type: string
        default: ''
      android_channel:
        description: v2 input, kept for the v1 interface; the gate refuses anything but sideload
        type: string
        default: sideload
      track:
        description: Play track
        type: string
        default: internal
      play_status:
        description: Play release status, draft until the app has shipped once
        type: string
        default: draft
      build:
        description: v2 input, kept for the v1 interface; the gate refuses a value
        type: string
        default: ''

permissions:
  contents: read


jobs:
  gate:
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ios_lane: ${{ steps.hub.outputs.ios_lane }}
      metered: ${{ steps.hub.outputs.metered }}
      mac_link: ${{ steps.hub.outputs.mac_link }}
      bundle: ${{ steps.hub.outputs.bundle }}
      slug: ${{ steps.hub.outputs.slug }}
      ios_store: ${{ steps.hub.outputs.ios_store }}
      policy: ${{ steps.hub.outputs.policy }}
    steps:
      # The caller file and the manifest at the dispatched commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: hub
        name: Policy, caller, Mac link, S26, build directory
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: gate
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          bump: ${{ inputs.bump }}
          testflight: ${{ inputs.testflight }}
          play: ${{ inputs.play }}
          channel: ${{ inputs.android_channel }}
          build: ${{ inputs.build }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          strict: ${{ inputs.strict }}
          metered: ${{ inputs.metered }}
          linux_runner: ${{ inputs.linux_runner }}
          mac_runner: ${{ inputs.mac_runner }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gate-out
          path: ${{ runner.temp }}/hub-out/gate/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  # No checkout and no artifact upload: the bundle id comes from the gate and the receipt goes back as a job output,
  # so a Mac on a metered link downloads only the hub action.
  preflight-ios:
    needs: gate
    if: ${{ needs.gate.outputs.ios_lane == 'run' }}
    runs-on: ${{ fromJSON(inputs.mac_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ipad_version: ${{ steps.hub.outputs.ipad_version }}
      ipad_build: ${{ steps.hub.outputs.ipad_build }}
      receipt: ${{ steps.hub.outputs.receipt }}
    steps:
      - id: hub
        name: Signing, profile, disk, the iPad
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: preflight-ios
          platform: ${{ inputs.platform }}
          testflight: ${{ inputs.testflight }}
          dry_run: ${{ inputs.dry_run }}
          strict: ${{ inputs.strict }}
          bundle: ${{ needs.gate.outputs.bundle }}
          slug: ${{ needs.gate.outputs.slug }}
          ios_store: ${{ needs.gate.outputs.ios_store }}
          mac_link: ${{ needs.gate.outputs.mac_link }}

  plan:
    needs: [gate, preflight-ios]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.preflight-ios.result == 'success' || needs.preflight-ios.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 20
    concurrency:
      group: mobile-deploy-plan-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      schema: ${{ steps.hub.outputs.schema }}
      version: ${{ steps.hub.outputs.version }}
      android_code: ${{ steps.hub.outputs.android_code }}
      ios_build: ${{ steps.hub.outputs.ios_build }}
      build_sha: ${{ steps.hub.outputs.build_sha }}
      bump_patch: ${{ steps.hub.outputs.bump_patch }}
      run_android: ${{ steps.hub.outputs.run_android }}
      run_ios: ${{ steps.hub.outputs.run_ios }}
      run_ios_export: ${{ steps.hub.outputs.run_ios_export }}
      play_lane: ${{ steps.hub.outputs.play_lane }}
      release_lane: ${{ steps.hub.outputs.release_lane }}
    steps:
      # Full history and tags: the bump is a real commit and the machine's pre-push guard refuses a shallow push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: hub
        name: S26, event contract, downgrade guards, version bump
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: plan
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          bump: ${{ inputs.bump }}
          testflight: ${{ inputs.testflight }}
          play: ${{ inputs.play }}
          track: ${{ inputs.track }}
          play_status: ${{ inputs.play_status }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          strict: ${{ inputs.strict }}
          ios_lane: ${{ needs.gate.outputs.ios_lane }}
          ipad_version: ${{ needs.preflight-ios.outputs.ipad_version }}
          ipad_build: ${{ needs.preflight-ios.outputs.ipad_build }}
          wif_provider: ${{ inputs.wif_provider }}
          play_sa: ${{ inputs.play_sa }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: plan-out
          path: ${{ runner.temp }}/hub-out/plan/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  android:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_android == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 45
    concurrency:
      group: mobile-deploy-android-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - name: Build, check, stage, Quickdrop, install on the S26 (or pending)
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: android
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          bump: ${{ inputs.bump }}
          play: ${{ inputs.play }}
          dry_run: ${{ inputs.dry_run }}
          version: ${{ needs.plan.outputs.version }}
          android_code: ${{ needs.plan.outputs.android_code }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
      - name: Authenticate to Google Cloud (keyless)
        if: ${{ !inputs.dry_run && needs.plan.outputs.play_lane == 'true' }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.play_sa }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Upload to Play
        if: ${{ !inputs.dry_run && needs.plan.outputs.play_lane == 'true' }}
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: play
          manifest: ${{ inputs.manifest }}
          play: ${{ inputs.play }}
          track: ${{ inputs.track }}
          play_status: ${{ inputs.play_status }}
          dry_run: ${{ inputs.dry_run }}
          android_code: ${{ needs.plan.outputs.android_code }}
          play_token: ${{ steps.auth.outputs.access_token }}
      - name: Publish the APK to a private Release
        if: ${{ !inputs.dry_run && needs.plan.outputs.release_lane == 'true' }}
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: release
          manifest: ${{ inputs.manifest }}
          bump: ${{ inputs.bump }}
          dry_run: ${{ inputs.dry_run }}
          version: ${{ needs.plan.outputs.version }}
          android_code: ${{ needs.plan.outputs.android_code }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          github_token: ${{ github.token }}
      # Receipts only (staging, the Release and the build directory hold the APK). always(): a timed-out or
      # cancelled lane still tells deliver and announce why.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: android-out
          path: ${{ runner.temp }}/hub-out/android/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  ios-export:
    needs: [gate, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ios_export == 'true' }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 30
    concurrency:
      group: mobile-deploy-ios-export-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - name: Export the Xcode projects and hand them to the Mac as a delta
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: ios-export
          manifest: ${{ inputs.manifest }}
          testflight: ${{ inputs.testflight }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          version: ${{ needs.plan.outputs.version }}
          ios_build: ${{ needs.plan.outputs.ios_build }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
          mac_link: ${{ needs.gate.outputs.mac_link }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ios-receipt
          path: ${{ runner.temp }}/hub-out/ios/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  ios:
    needs: [gate, plan, ios-export]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_ios == 'true' && (needs.ios-export.result == 'success' || needs.ios-export.result == 'skipped') }}
    runs-on: ${{ fromJSON(inputs.mac_runner) }}
    timeout-minutes: 120
    concurrency:
      group: mobile-deploy-ios-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The app tree is needed here too: ios.device and the store hooks are the app's own tools.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ needs.ios-export.result == 'success' }}
        with:
          name: ios-receipt
          path: ${{ runner.temp }}/hub-out/ios
      - name: Build, check, outbox, install on the iPad (or pending)
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: ios
          manifest: ${{ inputs.manifest }}
          bump: ${{ inputs.bump }}
          testflight: ${{ inputs.testflight }}
          dry_run: ${{ inputs.dry_run }}
          dry_handoff: ${{ inputs.dry_handoff }}
          strict: ${{ inputs.strict }}
          version: ${{ needs.plan.outputs.version }}
          ios_build: ${{ needs.plan.outputs.ios_build }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          bump_patch: ${{ needs.plan.outputs.bump_patch }}
          mac_link: ${{ needs.gate.outputs.mac_link }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ios-out
          path: |
            ${{ runner.temp }}/hub-out/ios/hub-receipt-ios.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  deliver:
    needs: [gate, plan, android, ios-export, ios]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 45
    concurrency:
      group: mobile-deploy-deliver-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The manifest (and project.icon) at the commit the lanes built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.build_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '{plan-out,android-out,ios-receipt,ios-out}'
          path: ${{ runner.temp }}/hub-out/receipts
      - name: Publish to the build directory (a dry run only checks)
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: deliver
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          dry_run: ${{ inputs.dry_run }}
          version: ${{ needs.plan.outputs.version }}
          android_code: ${{ needs.plan.outputs.android_code }}
          ios_build: ${{ needs.plan.outputs.ios_build }}
          build_sha: ${{ needs.plan.outputs.build_sha }}
          mac_link: ${{ needs.gate.outputs.mac_link }}
          needs: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: deliver-out
          path: ${{ runner.temp }}/hub-out/deliver/*.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: ${{ inputs.dry_run && 1 || 7 }}

  announce:
    needs: [gate, preflight-ios, plan, android, ios-export, ios, deliver]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '{gate-out,plan-out,android-out,ios-receipt,ios-out,deliver-out}'
          path: ${{ runner.temp }}/hub-out/receipts
      - name: One Bloodbank event (a dry run only checks it)
        uses: delorenj/mobile-deploy-hub/actions/hub@v1.1.1
        with:
          command: announce
          manifest: ${{ inputs.manifest }}
          platform: ${{ inputs.platform }}
          dry_run: ${{ inputs.dry_run }}
          ios_lane: ${{ needs.gate.outputs.ios_lane }}
          needs: ${{ toJSON(needs) }}
