name: System-Wide Mobile Deploy Hub

on:
  repository_dispatch:
    types: [deploy-mobile]

jobs:
  export:
    runs-on: [self-hosted, linux, godot]
    timeout-minutes: 30
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.ref }}
          path: source-repo

      - name: Checkout Hub Repo
        uses: actions/checkout@v4
        with:
          path: hub-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-Export Command
        if: ${{ github.event.client_payload.pre_export_command != '' }}
        run: cd source-repo && eval "${{ github.event.client_payload.pre_export_command }}"

      - name: Export Project
        run: |
          node hub-repo/tools/ci/deploy-hub.mjs export \
            --platform ${{ github.event.client_payload.platform }} \
            --path source-repo/${{ github.event.client_payload.godot_path || 'native/godot' }} \
            --preset "${{ github.event.client_payload.export_preset }}" \
            --out .deploy-hub-out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.platform }}-artifact
          path: .deploy-hub-out/
          retention-days: 1

  upload-android:
    needs: export
    if: ${{ github.event.client_payload.platform == 'android' }}
    runs-on: [self-hosted, Linux, delonet]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Hub Repo
        uses: actions/checkout@v4
        with:
          path: hub-repo

      - uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: .deploy-hub-out/

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Upload to Play Console
        env:
          PLAY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node hub-repo/tools/ci/deploy-hub.mjs upload-android \
            --package ${{ github.event.client_payload.package_name }} \
            --track ${{ github.event.client_payload.track || 'internal' }} \
            --artifact .deploy-hub-out/app.aab

  upload-ios:
    needs: export
    if: ${{ github.event.client_payload.platform == 'ios' }}
    runs-on: [self-hosted, macOS, ios-signing]
    timeout-minutes: 60
    steps:
      - name: Checkout Hub Repo
        uses: actions/checkout@v4
        with:
          path: hub-repo

      - uses: actions/download-artifact@v4
        with:
          name: ios-artifact
          path: .deploy-hub-out/

      - name: Upload to TestFlight
        run: |
          node hub-repo/tools/ci/deploy-hub.mjs upload-ios \
            --package ${{ github.event.client_payload.package_name }} \
            --artifact .deploy-hub-out/app.zip
