name: Mobile Deploy Hub tool
description: Runs tools/ci/hub.mjs from the hub repo against the checked-out app. Inputs only; a composite action cannot read secrets or vars.

inputs:
  command:
    description: gate, preflight-ios, plan, android, play, release, ios-export, ios, deliver, announce. Inside a job every command runs only for the app's own .github/workflows/deploy.yml
    required: true
  manifest:
    description: Path of the app manifest inside the checkout
    default: mobile-deploy.json
  platform:
    default: both
  bump:
    description: patch, minor or major (every deploy bumps)
    default: patch
  testflight:
    default: 'false'
  play:
    default: 'false'
  channel:
    description: v2 input; the gate refuses anything but sideload
    default: sideload
  track:
    default: internal
  play_status:
    description: Play release status; empty lets the hub decide (completed on the internal track, draft elsewhere)
    default: ''
  build:
    description: v2 input; the gate refuses a value
    default: ''
  dry_run:
    default: 'true'
  dry_handoff:
    default: 'false'
  strict:
    description: The gate refuses false (policy)
    default: 'true'
  metered:
    description: auto or allow (the iPad lane on a metered Mac link)
    default: auto
  linux_runner:
    description: The Linux runner labels the caller passed, for the gate's policy check
    default: '["self-hosted","Linux"]'
  mac_runner:
    description: The Mac runner labels the caller passed, for the gate's policy check
    default: '["self-hosted","macOS"]'
  ios_lane:
    description: The gate's verdict on the iPad lane (run, skip-offline, skip-metered, skip-platform)
    default: ''
  mac_link:
    description: The gate's reading of the Mac's link (home, metered, offline)
    default: ''
  bundle:
    description: The iOS bundle id from the gate (preflight-ios has no checkout)
    default: ''
  slug:
    description: The app slug from the gate
    default: ''
  ios_store:
    description: The TestFlight signer and op:// references from the gate, as JSON (preflight-ios with --testflight)
    default: ''
  version:
    description: Version announced by the plan job
    default: ''
  android_code:
    description: Android versionCode announced by the plan job
    default: ''
  ios_build:
    description: iOS build announced by the plan job
    default: ''
  build_sha:
    description: The commit the lanes build (the bump commit on a real run)
    default: ''
  bump_patch:
    description: The plan's version bump as a base64 patch, applied by the lanes of a dry run
    default: ''
  ipad_version:
    description: The iPad's installed version from preflight-ios (absent when not installed, unreachable when away)
    default: ''
  ipad_build:
    default: ''
  needs:
    description: toJSON(needs), deliver and announce only
    default: ''
  scope:
    description: deliver only, the half of the build directory it publishes (android, ios; both for a local run)
    default: both
  wif_provider:
    default: ''
  play_sa:
    default: ''
  play_token:
    description: Play access token from google-github-actions/auth, play step only
    default: ''
  github_token:
    description: Token with contents write, plan (the bump push) and release steps only
    default: ''

outputs:
  ios_lane:
    description: The gate's verdict on the iPad lane
    value: ${{ steps.hub.outputs.ios_lane }}
  metered:
    description: true when the Mac is on a metered link
    value: ${{ steps.hub.outputs.metered }}
  mac_link:
    description: home, metered or offline
    value: ${{ steps.hub.outputs.mac_link }}
  bundle:
    description: The iOS bundle id (gate)
    value: ${{ steps.hub.outputs.bundle }}
  slug:
    description: The app slug (gate)
    value: ${{ steps.hub.outputs.slug }}
  ios_store:
    description: The TestFlight signer and references as JSON (gate)
    value: ${{ steps.hub.outputs.ios_store }}
  policy:
    description: The first 8 hex of the policy's sha256 (gate)
    value: ${{ steps.hub.outputs.policy }}
  receipt:
    description: preflight-ios's receipt as base64 JSON (it uploads no artifact)
    value: ${{ steps.hub.outputs.receipt }}
  schema:
    description: The manifest schema (2)
    value: ${{ steps.hub.outputs.schema }}
  version:
    description: The version this deploy builds (the bumped one)
    value: ${{ steps.hub.outputs.version }}
  android_code:
    description: Android versionCode this deploy builds
    value: ${{ steps.hub.outputs.android_code }}
  ios_build:
    description: iOS build from the version hook
    value: ${{ steps.hub.outputs.ios_build }}
  build_sha:
    description: The commit the lanes check out
    value: ${{ steps.hub.outputs.build_sha }}
  bump_patch:
    description: The bump as a base64 patch (dry runs)
    value: ${{ steps.hub.outputs.bump_patch }}
  run_android:
    description: true when the Android lane runs
    value: ${{ steps.hub.outputs.run_android }}
  run_ios:
    description: true when the iOS lane runs
    value: ${{ steps.hub.outputs.run_ios }}
  run_ios_export:
    description: true when the Linux iOS export runs
    value: ${{ steps.hub.outputs.run_ios_export }}
  play_lane:
    description: true when Play is in scope
    value: ${{ steps.hub.outputs.play_lane }}
  release_lane:
    description: true when a real run publishes the sideload Release
    value: ${{ steps.hub.outputs.release_lane }}
  ipad_version:
    description: The iPad's installed version (preflight-ios)
    value: ${{ steps.hub.outputs.ipad_version }}
  ipad_build:
    description: The iPad's installed build (preflight-ios)
    value: ${{ steps.hub.outputs.ipad_build }}

runs:
  using: composite
  steps:
    - id: hub
      shell: bash
      env:
        HUB_TOOL: ${{ github.action_path }}/../../tools/ci/hub.mjs
        HUB_COMMAND: ${{ inputs.command }}
        HUB_MANIFEST: ${{ inputs.manifest }}
        HUB_PLATFORM: ${{ inputs.platform }}
        HUB_BUMP: ${{ inputs.bump }}
        HUB_TESTFLIGHT: ${{ inputs.testflight }}
        HUB_PLAY: ${{ inputs.play }}
        HUB_CHANNEL: ${{ inputs.channel }}
        HUB_TRACK: ${{ inputs.track }}
        HUB_PLAY_STATUS: ${{ inputs.play_status }}
        HUB_BUILD: ${{ inputs.build }}
        HUB_DRY_RUN: ${{ inputs.dry_run }}
        HUB_DRY_HANDOFF: ${{ inputs.dry_handoff }}
        HUB_STRICT: ${{ inputs.strict }}
        HUB_METERED: ${{ inputs.metered }}
        HUB_LINUX_RUNNER: ${{ inputs.linux_runner }}
        HUB_MAC_RUNNER: ${{ inputs.mac_runner }}
        HUB_IOS_LANE: ${{ inputs.ios_lane }}
        HUB_MAC_LINK: ${{ inputs.mac_link }}
        HUB_BUNDLE: ${{ inputs.bundle }}
        HUB_SLUG: ${{ inputs.slug }}
        HUB_IOS_STORE: ${{ inputs.ios_store }}
        HUB_REF: ${{ github.action_ref }}
        HUB_VERSION: ${{ inputs.version }}
        HUB_ANDROID_CODE: ${{ inputs.android_code }}
        HUB_IOS_BUILD: ${{ inputs.ios_build }}
        HUB_BUILD_SHA: ${{ inputs.build_sha }}
        HUB_BUMP_PATCH: ${{ inputs.bump_patch }}
        HUB_IPAD_VERSION: ${{ inputs.ipad_version }}
        HUB_IPAD_BUILD: ${{ inputs.ipad_build }}
        HUB_NEEDS: ${{ inputs.needs }}
        HUB_SCOPE: ${{ inputs.scope }}
        HUB_WIF_PROVIDER: ${{ inputs.wif_provider }}
        HUB_PLAY_SA: ${{ inputs.play_sa }}
        PLAY_TOKEN: ${{ inputs.play_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: node "$HUB_TOOL" "$HUB_COMMAND"
