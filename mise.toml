# mise configuration for Mobile Deploy Hub
# https://mise.jdx.dev/configuration.html

[env]
_.path = [".mise/scripts"]
_.file = [".env"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
#
# NOTE: every managed script is handed config_root EXPLICITLY. A mise enter
# hook runs with cwd set to the directory you cd'd into -- including a PARENT
# config's hook -- so a script that reads its subject from cwd reshapes
# whichever nested repo you entered. config_root locates the file; the
# argument locates the subject. The scripts refuse to run without it.
#
# NOTE: hooks are an array of [[hooks.enter]] tables (NOT enter = [ ... ]) and
# every {{config_root}} path is single-quoted so it survives a space in the
# project path — mise runs each `run` via `sh -c`. (`run`, not `script`: mise
# deprecated `script` for spawned hook commands and removes it in 2027.3.0.)
[[hooks.enter]]
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
[[hooks.enter]]
# Atomic (PJAN-24/PJAN-57): shell complexity lives in the managed script so
# mise never interpolates temporary variables. The script uses mktemp, traps
# cleanup, and replaces .env only after op inject succeeds.
run = "'{{config_root}}/.mise/scripts/materialize-env.sh'"
[[hooks.enter]]
run = "[ -f '{{config_root}}/.mise/scripts/codegraph.sh' ] && '{{config_root}}/.mise/scripts/codegraph.sh' || true"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"
[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

[tasks."hindsight:setup"]
description = "Provision this dev's shared project Hindsight key from 1Password into .env (op read; upserts those two keys, leaves the rest of .env intact)"
run = "'{{config_root}}/.mise/scripts/hindsight-setup.sh'"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<

# The hub's checks. The repo is public, so .github/workflows/check.yml runs this same task on a free GitHub-hosted
# runner on every push to main and every pull request; run it here before a release (`mise run release` runs it too).
[tasks.check]
description = "Lint the reusable workflow with actionlint, then run the tool tests"
tools = { actionlint = "1.7.12", node = "24" }
# Node 24 is the hub's runtime and this task's pin; `mise run --tool node@26 check` runs the same task on Node 26 (check.yml's
# second leg), and the first line says which Node a log was made with. The glob is node's own (quoted), so
# tools/catchup/*.test.mjs runs here too.
run = ["node --version", "actionlint .github/workflows/*.yml", "node --test 'tools/**/*.test.mjs'"]

# ---- mobile-deploy-hub v1.1 (docs/design-hub-v1.1.md) ----
# The usage specs own --dry-run and friends, so `mise run deploy:train --dry-run false` reaches the front door
# instead of mise's own --dry-run.
[tasks."deploy"]
description = "Deploy one app from here, with the front door the apps run: mise run deploy --repo delorenj/gruvato [--dry-run false]"
usage = '''
flag "--repo <repo>"
flag "--dry-run <dry_run>" default="true"
flag "--bump <bump>" default=""
flag "--platform <platform>" default="both"
flag "--testflight <testflight>" default="false"
flag "--play <play>" default="false"
flag "--dry-handoff <dry_handoff>" default="false"
flag "--metered <metered>" default="auto"
'''
run = 'node tools/deploy.mjs --repo "$usage_repo" --dry-run "$usage_dry_run" --bump "$usage_bump" --platform "$usage_platform" --testflight "$usage_testflight" --play "$usage_play" --dry-handoff "$usage_dry_handoff" --metered "$usage_metered"'

# The one command (TOWE-76): recover a red last real run first, else dry run, then the real run on the same commit, then
# the completion verdict from the run's completion-out artifact. Exit 0 only when every required target is installed or
# durably pending (and TestFlight assigned for a store app); 4 owes something and says the command, 1 red, 3 unknown,
# 5 busy or blocked. No --platform, --testflight or --dry-run: ship never narrows.
[tasks."ship"]
description = "Ship one app from here, the way the apps' own `mise run ship` does: mise run ship --repo delorenj/gruvato [--bump minor] [--metered allow] [--abandon RUN_ID]"
usage = '''
flag "--repo <repo>"
flag "--bump <bump>" default=""
flag "--metered <metered>" default="auto"
flag "--abandon <abandon>" default=""
'''
run = 'node tools/deploy.mjs ship --repo "$usage_repo" --bump "$usage_bump" --metered "$usage_metered" --abandon "$usage_abandon"'

[tasks."deploy:train"]
description = "Deploy Tower, then Green In Between, then Gruvato, one at a time; stops at the first red run"
usage = '''
flag "--dry-run <dry_run>" default="true"
flag "--bump <bump>" default=""
flag "--platform <platform>" default="both"
flag "--dry-handoff <dry_handoff>" default="false"
flag "--metered <metered>" default="auto"
'''
run = 'node tools/deploy.mjs train --dry-run "$usage_dry_run" --bump "$usage_bump" --platform "$usage_platform" --dry-handoff "$usage_dry_handoff" --metered "$usage_metered"'

# The App Store listing (TOLT-153): the text, ratings, review notes and screenshots of an app's store page, kept as
# store/apple/listing.json in the app's repo and written through the ASC API. Never touches builds, TestFlight, price or review.
[tasks."listing"]
description = "App Store listing: mise run listing pull|push <app-repo-dir> [--apply true] [--repo owner/name] [--only screenshots|fields]; push prints a diff unless --apply true"
tools = { node = "24" }
usage = '''
arg "<command>"
arg "<dir>"
flag "--apply <apply>" default="false"
flag "--repo <repo>" default=""
flag "--only <only>" default="" help="screenshots or fields: push just that part"
'''
run = 'node tools/listing.mjs "$usage_command" "$usage_dir" $([ "$usage_apply" = true ] && echo --apply) $([ -n "$usage_repo" ] && echo --repo "$usage_repo") $([ -n "$usage_only" ] && echo --only "$usage_only")'

[tasks.conformance]
description = "Check through gh api that Tower, Green In Between and Gruvato deploy only through the hub (caller hash, manifest, no other uploads, no bump/tag/announce tasks)"
tools = { node = "24" }
run = "node tools/conformance.mjs"

[tasks."bucket-policy"]
description = "Check the build directory's access (MOBI-17): tools/ci/bucket-policy.json equals what policy.json renders, and the live bucket answers anonymous probes as it says (no listing, no private device APK). Needs no credential."
tools = { node = "24" }
run = "node tools/bucket-policy.mjs check"

[tasks."bucket-policy:apply"]
description = "Set the live bucket policy of `builds` from tools/ci/bucket-policy.json (idempotent; admin keys from 1Password over loopback), then run the check. Add --dry-run to see the diff only."
tools = { node = "24" }
run = "node tools/bucket-policy.mjs apply"

[tasks.release]
description = "Release the hub: mise run release -- X.Y.Z (check, conformance, tag, move v1, one strict dry run per app, v1 back if red)"
tools = { node = "24", actionlint = "1.7.12" }
run = "node tools/release.mjs"

[tasks."hosts:install"]
description = "The hosts' half: build directory index, hub-mac, the Mac's quickdrop .stignore and handoff cache, each host's key (linux / mac), the catch-up units on both hosts, the Hub API service on big-chungus (units installed, enabled, restarted, /health read back for the release) and the Host Agent LaunchAgent on the Mac (release copied only when missing, plist rendered, bootstrapped, /health read back through hub-client), then a check that both services report one contract and hub_version"
tools = { node = "24" }
run = "node tools/hosts.mjs"

[tasks."hosts:smoke"]
description = "The live check of an installed Hub API on big-chungus: /health at this release and contract, register a test phone, lease it by name within 60 s, see it in the phone word and status, release, run the holds phase (the same Hold sequence through the Hub API and through hub-device must give equal traces), run the stream phase (GET /stream opens, a hub-device Lease shows in a status frame within 2 s, its release does too, a keepalive arrives idle), retire, see it gone (HUB_SMOKE_OK). Leaves one retired record in registry.json per run, so it is never part of hosts:install. Options: --hub-device <cmd>, --ref <ref>, --holds-on <word> (run the holds phase on that device, e.g. s24, instead of the test phone), --no-holds, --no-stream (skip the stream phase), --restart (also restart the service mid-stream: the Lease must survive and the reconnect must get reset; ask for it at release time), --lanes (opt-in, after the stream phase: take every other host's lane, the Mac's ios-lane, through hub-device from here, see it in that host's own view with its started_at and big-chungus writing no lock, release it, see it free; needs the Mac awake and the lane free; ask for it at release time)"
tools = { node = "24" }
run = "node tools/hosts/smoke.mjs"
